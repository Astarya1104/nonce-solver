name: nonce-watch
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
concurrency:
  group: nonce-watch
  cancel-in-progress: false
permissions:
  issues: write
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: watch admission every 2 minutes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_SECONDS: "20700"
          INTERVAL: "120"
        run: python3 watch/watch.py
